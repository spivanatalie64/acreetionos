# ═══════════════════════════════════════════════════════════════════
#  AcreetionOS ISO Build Pipeline
#  Branch: acreetionos
#  Builder: self-hosted shell runner on Dell Precision 7910
#
#  RUNNER SETUP (run once on the build server):
#    gitlab-runner register \
#      --url https://gitlab.acreetionos.org \
#      --token <YOUR_RUNNER_TOKEN> \
#      --executor shell \
#      --description "acreetionos-builder" \
#      --tag-list "acreetionos" \
#      --run-untagged false
#
#  The runner user needs passwordless sudo (or run as root).
#  mkarchiso requires loop device access for squashfs builds.
# ═══════════════════════════════════════════════════════════════════

stages:
  - prepare
  - build
  - publish

variables:
  ISO_OUT_DIR:   "${CI_PROJECT_DIR}/out"
  WORK_DIR:      "${CI_PROJECT_DIR}/work"
  ISO_LABEL:     "AcreetionOS"
  PUBLISH_DIR:   "/srv/http/iso"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "acreetionos"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ───────────────────────────────────────────────────────────────────
# STAGE 1 – PREPARE
# Refresh keyring and ensure archiso + build deps are installed
# ───────────────────────────────────────────────────────────────────
prepare:deps:
  stage: prepare
  tags:
    - acreetionos
  script:
    - echo "==> Initialising pacman keyring..."
    - pacman-key --init
    - pacman-key --populate archlinux
    - echo "==> Refreshing databases and upgrading keyring..."
    - pacman -Sy --noconfirm --config "${CI_PROJECT_DIR}/pacman.conf" archlinux-keyring
    - echo "==> Installing archiso build dependencies..."
    - pacman -S --noconfirm --needed --config "${CI_PROJECT_DIR}/pacman.conf" archiso squashfs-tools dosfstools erofs-utils mtools xorriso libarchive grub edk2-shell
    - echo "==> Build environment ready."
    - mkarchiso --version
  rules:
    - when: always

# ───────────────────────────────────────────────────────────────────
# STAGE 2 – BUILD ISO
# pacman.conf defines:
#   [acreetionOSREPO-main]  iso.acreetionos.org:8448/repo-main/$arch
#   [personal]              iso.acreetionos.org:8448/personal
#   [temp-repo]             iso.acreetionos.org:8448/temp_repo/
#   IgnorePkg = v4l2loopback-dkms
#   ParallelDownloads = 25
# ───────────────────────────────────────────────────────────────────
# Build matrix: base (cinnamon) + every desktop-environment variant.
# Each variant = same AcreetionOS, only the DE swapped (variants/official/<de>).
build:iso:
  stage: build
  tags:
    - acreetionos
  needs:
    - prepare:deps
  timeout: 3h
  parallel:
    matrix:
      - VARIANT: [cinnamon, gnome, plasma, xfce, mate, openbox, sway, i3, hyprland]
  variables:
    VWORK: "${CI_PROJECT_DIR}/work-${VARIANT}"
    VOUT:  "${CI_PROJECT_DIR}/out-${VARIANT}"
  before_script:
    - echo "==> Cleaning previous build artifacts..."
    - rm -rf "${VWORK}" "${VOUT}"
    - mkdir -p "${VOUT}"
  script:
    - echo "==> Starting AcreetionOS ISO build ($VARIANT)..."
    - echo "    Commit  ${CI_COMMIT_SHORT_SHA}  Branch  ${CI_COMMIT_BRANCH:-tag:$CI_COMMIT_TAG}  Runner  ${CI_RUNNER_DESCRIPTION}"
    - cd "${CI_PROJECT_DIR}"
    - chmod +x build.sh
    - if [ "$VARIANT" = "cinnamon" ]; then ./build.sh; else ./build.sh "$VARIANT" official; fi
    - echo "==> Build complete."
    # variant builds drop ISOs in ../ISO/<variant>; base uses out/
    - |
      if [ "$VARIANT" = "cinnamon" ]; then
        ISO_DIR="${CI_PROJECT_DIR}/out"
      else
        ISO_DIR="${CI_PROJECT_DIR}/../ISO/${VARIANT}"
      fi
      ls -lh "$ISO_DIR"/*.iso
      cd "$ISO_DIR"
      sha256sum *.iso > "${VOUT}/SHA256SUMS"
      md5sum *.iso > "${VOUT}/MD5SUMS"
      cp *.iso "${VOUT}/"
    - cat SHA256SUMS
  after_script:
    - rm -rf "${WORK_DIR}"
  artifacts:
    name: "AcreetionOS-${CI_COMMIT_SHORT_SHA}"
    paths:
      - out/*.iso
      - out/SHA256SUMS
      - out/MD5SUMS
    expire_in: 30 days

# ───────────────────────────────────────────────────────────────────
# STAGE 3 – PUBLISH
# Copies ISO to the nginx-served directory, updates latest symlink,
# keeps the 3 most recent builds and prunes the rest.
# ───────────────────────────────────────────────────────────────────
publish:iso:
  stage: publish
  tags:
    - acreetionos
  needs:
    - build:iso
  script:
    - |
      # gather every built ISO (base in out/, variants in out-<variant>/)
      for DIR in "${CI_PROJECT_DIR}"/out*; do
        [ -d "$DIR" ] || continue
        for ISO_FILE in "$DIR"/*.iso; do
          [ -f "$ISO_FILE" ] || continue
          ISO_NAME=$(basename "$ISO_FILE")
          SLUG=$(echo "$ISO_NAME" | sed 's/\.iso$//' | sed 's/AcreetionOS[-_]//' | tr '[:upper:]' '[:lower:]')
          echo "==> Publishing $ISO_NAME as ${SLUG}-latest.iso"
          mkdir -p "${PUBLISH_DIR}"
          cp "$ISO_FILE" "${PUBLISH_DIR}/${SLUG}-latest.iso"
        done
        cp "$DIR/SHA256SUMS" "${PUBLISH_DIR}/SHA256SUMS" 2>/dev/null || true
        cp "$DIR/MD5SUMS" "${PUBLISH_DIR}/MD5SUMS" 2>/dev/null || true
      done
      echo "==> Done."
      ls -lh "${PUBLISH_DIR}"/*-latest.iso
  environment:
    name: iso-server
