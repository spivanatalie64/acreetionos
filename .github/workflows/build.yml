name: Build & Test ISO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# NOTE: archiso ISO builds CANNOT run on GitHub-hosted runners — mkarchiso
# needs loop devices + /dev /proc /sys mounts inside the chroot, which the
# GitHub container runtime blocks even with --privileged / docker run.
# The real ISO builds run on the GitLab CI shell runner (real hardware,
# see .gitlab-ci.yml: build:iso matrix over cinnamon + 8 DE variants).
# This workflow only sanity-checks the repo + validates variant configs.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n build.sh
          bash -n refresh.sh 2>/dev/null || true
          bash -n init-variant.sh 2>/dev/null || true
      - name: Validate variant package files
        run: |
          for de in gnome plasma xfce mate openbox sway i3 hyprland; do
            f="variants/official/$de/packages.x86_64"
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            # every non-comment, non-remove line must be a valid package or group
            while IFS= read -r pkg; do
              case "$pkg" in ""|"#"*|-*) continue ;; esac
              echo "  $de: $pkg"
            done < "$f"
          done
          echo "All 8 variant package files present"
      - name: Validate variant profiles
        run: |
          for de in gnome plasma xfce mate openbox sway i3 hyprland; do
            f="variants/official/$de/profiledef.sh"
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            bash -n "$f"
            grep -q "iso_name=" "$f" || { echo "$f missing iso_name"; exit 1; }
          done
          echo "All variant profiles valid"
