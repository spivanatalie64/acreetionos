name: Build & Test ISO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [cinnamon, gnome, plasma, xfce, mate, openbox, sway, i3, hyprland]
    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq archlinux-keyring 2>/dev/null || true
      # Run archiso via the official archlinux container but on the HOST
      # namespace with full mount access. archiso needs real loop devices +
      # /dev /proc /sys mounts inside the chroot — a nested container can't
      # provide those reliably, so we use a one-shot archlinux container with
      # --privileged and let it do the mount work.
      - uses: actions/checkout@v7
      - name: Build ISO (${{ matrix.variant }})
        run: |
          docker run --rm --privileged \
            -v "$PWD:/build" \
            -w /build \
            archlinux:latest \
            bash -c '
              pacman -Sy --noconfirm archlinux-keyring >/dev/null 2>&1
              pacman -S --noconfirm --needed archiso squashfs-tools dosfstools erofs-utils mtools xorriso libarchive grub edk2-shell git >/dev/null 2>&1
              chmod +x build.sh
              if [ "${{ matrix.variant }}" = "cinnamon" ]; then
                ./build.sh 2>&1
              else
                ./build.sh ${{ matrix.variant }} official 2>&1
              fi
            '
      - name: Verify ISO
        run: |
          for f in out/*.iso; do
            [ -f "$f" ] || { echo "No ISO produced"; exit 1; }
            echo "ISO: $f ($(du -h "$f" | cut -f1))"
            sha256sum "$f"
          done
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7
        with:
          name: acreetionos-${{ matrix.variant }}-iso
          path: out/*.iso
          retention-days: 7
