name: Publish Editions

# NOTE: ISO artifacts are produced by the GitLab CI pipeline (shell runner),
# which publishes <slug>-latest.iso to the iso-server directly. This
# workflow is a fallback for manual publish of locally-built ISOs.
on:
  workflow_dispatch:
    inputs:
      iso_dir:
        description: 'Directory containing ISOs (path on this repo checkout)'
        required: false
        default: 'out'

env:
  DL_SERVER: us.iso.acreetionos.org
  DL_PORT: 2400
  DL_USER: natalie
  DL_DIR: /drive1/acreetion

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Find ISOs
        id: find
        run: |
          ISOS=$(find "${{ github.event.inputs.iso_dir }}" -name "*.iso" 2>/dev/null || true)
          if [ -z "$ISOS" ]; then
            echo "No ISOs found — nothing to publish (GitLab CI handles normal builds)"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ISOS"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy ISOs to download server
        if: steps.find.outputs.found == 'true'
        env:
          DL_SSH_KEY: ${{ secrets.DL_SSH_KEY }}
        run: |
          echo "$DL_SSH_KEY" > /tmp/dl_key
          chmod 600 /tmp/dl_key
          for iso in $(find "${{ github.event.inputs.iso_dir }}" -name "*.iso"); do
            base=$(basename "$iso")
            slug=$(echo "$base" | sed 's/\.iso$//' | sed 's/AcreetionOS[-_]//' | tr '[:upper:]' '[:lower:]')
            echo "Uploading $base as ${slug}-latest.iso"
            scp -P $DL_PORT -i /tmp/dl_key -o StrictHostKeyChecking=no \
              "$iso" "${DL_USER}@${DL_SERVER}:${DL_DIR}/${slug}-latest.iso" || echo "FAILED: $base"
          done
