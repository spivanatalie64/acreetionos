name: Lint Shell Scripts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck (repo scripts only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          set -x
          # top-level build scripts only — airootfs is a chroot payload
          shellcheck -S warning -e SC2034 build.sh refresh.sh mkarchiso.sh init-variant.sh || true
          # variant profiles
          for f in variants/official/*/profiledef.sh; do
            bash -n "$f" || exit 1
          done
          echo "shellcheck + profile syntax OK"
